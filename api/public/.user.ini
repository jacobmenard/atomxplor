; PHP Configuration to Override 2MB Upload Limit
; This file overrides PHP's default upload_max_filesize = 2M

; Maximum size of uploaded files (this fixes the 2MB limit!)
upload_max_filesize = 500M

; Maximum size of POST data that PHP will accept
post_max_size = 500M

; Maximum number of files that can be uploaded via a single request
max_file_uploads = 20

; Maximum amount of memory a script may consume
memory_limit = 512M

; Maximum execution time of each script, in seconds
max_execution_time = 300

; Maximum time to spend on a single file upload, in seconds
max_input_time = 300

; Maximum number of input variables (for large forms)
max_input_vars = 3000